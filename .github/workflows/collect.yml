name: 抖音热点采集

on:
  # 每 4 小时自动运行
  schedule:
    - cron: '17 */4 * * *'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      hot_only:
        description: '只采集热搜'
        type: boolean
        default: false
      notify:
        description: '发送通知'
        type: boolean
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行采集
        env:
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_USER_ID: ${{ secrets.WECOM_USER_ID }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}  # 可选，优先从数据库读
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.hot_only }}" = "true" ]; then
            python -m scripts.collect --hot-only
          elif [ "${{ github.event.inputs.notify }}" = "false" ]; then
            python -m scripts.collect --no-notify
          else
            python -m scripts.collect
          fi
