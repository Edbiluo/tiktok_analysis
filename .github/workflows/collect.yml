name: 抖音热点采集

on:
  schedule:
    # 热搜监控：每 10 分钟
    - cron: '*/10 * * * *'
    # 同行账号全量采集：每 2 小时
    - cron: '7 */2 * * *'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '采集模式'
        type: choice
        options:
          - full
          - hot-only
        default: full
      notify:
        description: '发送通知'
        type: boolean
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断采集模式
        id: mode
        run: |
          # 手动触发时用用户选择
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          # 定时触发时根据 cron 判断
          elif [ "$(date +%M)" -lt 15 ] && [ "$(($(date +%H) % 2))" -eq 0 ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=hot-only" >> $GITHUB_OUTPUT
          fi

      - name: 运行采集
        env:
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_USER_ID: ${{ secrets.WECOM_USER_ID }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
          AI_MODEL: claude-haiku-4-5
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "hot-only" ]; then
            python -m scripts.collect --hot-only
          else
            python -m scripts.collect
          fi
